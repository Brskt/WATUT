name: Build

on:
  push:
    branches: [ 1.21.11, 26.1-snapshot-10 ]

jobs:
  build-fabric:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WATUT
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ startsWith(github.ref_name, '26.') && '25' || '21' }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clone CoroUtil
        run: git clone --branch ${{ github.ref_name }} --depth 1 https://github.com/Brskt/CoroUtil.git ../CoroUtil

      - name: Build CoroUtil (Fabric) and publish to mavenLocal
        working-directory: ../CoroUtil
        run: ./gradlew -Dcoroutil.buildScript=build_fabric.gradle publishToMavenLocal

      - name: Build WATUT (Fabric)
        run: ./gradlew -Dcoroutil.buildScript=build_fabric.gradle build

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: watut-fabric
          path: build/libs/watut-fabric-*.jar

  build-neoforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WATUT
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ startsWith(github.ref_name, '26.') && '25' || '21' }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clone CoroUtil
        run: git clone --branch ${{ github.ref_name }} --depth 1 https://github.com/Brskt/CoroUtil.git ../CoroUtil

      - name: Build CoroUtil (NeoForge) and publish to mavenLocal
        working-directory: ../CoroUtil
        run: ./gradlew -Dcoroutil.buildScript=build_neoforge.gradle publishToMavenLocal

      - name: Build WATUT (NeoForge)
        run: ./gradlew -Dcoroutil.buildScript=build_neoforge.gradle build

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: watut-neoforge
          path: build/libs/watut-neoforge-*.jar
