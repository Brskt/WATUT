plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.0-alpha.10'
    id 'maven-publish'
    id "com.hypherionmc.modutils.modpublisher" version "2.1.6"
}

version = project.mod_version
group = project.maven_group

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()

    // Complete Config repos
    maven {
        url 'https://jitpack.io'
    }
    maven {
        url "https://maven.terraformersmc.com/"
    }
    maven {
        url "https://maven.shedaniel.me/"
    }
    maven {
        url "https://maven.siphalor.de/"
    }
    maven {
        url "https://maven.isxander.dev/releases"
    }
    maven {
        name = "ParchmentMC"
        url = "https://maven.parchmentmc.net/"
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        url "https://api.modrinth.com/maven"
    }
    flatDir {
        dir 'libs'
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.1+ Fabric snapshots ship unobfuscated jars. No mappings dependency needed.
    /*parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    officialMojangMappings { nameSyntheticMembers = false }*/
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Loom 1.16 alpha on 26.x snapshots may not expose modImplementation in this setup.
    // CoroUtil is already built/published locally for the same unobfuscated target, so implementation is sufficient.
    if (project.minecraft_version.startsWith("26.")) {
        implementation "com.corosus.coroutil:coroutil-fabric:${project.minecraft_version}-${project.coroutil_version}"
    } else {
        modImplementation "com.corosus.coroutil:coroutil-fabric:${project.minecraft_version}-${project.coroutil_version}"
    }

    // Fabric API. This is technically optional, but you probably want it anyway.
    include(implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    //include(modImplementation("ForgeConfigAPIPort:ForgeConfigAPIPort:v8.0.0-1.20.1-Fabric"))
    //using https://www.curseforge.com/minecraft/mc-mods/forge-config-api-port-fabric/files/4583000
    //include(modImplementation("curse.maven:forge-config-api-port-fabric-547434:7213620"))
    // No 26.1 snapshot build of ForgeConfigAPIPort is currently published.
    implementation 'com.electronwill.night-config:core:3.7.3'
    implementation 'com.electronwill.night-config:toml:3.7.3'
    //include(modImplementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:v8.0.0-1.20.1-Fabric"))

    // Work around a Loom alpha snapshot issue where the generated merged dependency can be source-only.
    // We only need this for 26.x snapshots and keep it compileOnly so runtime/remap behavior stays with Loom.
    if (project.minecraft_version.startsWith("26.")) {
        def loomClientJar = new File(gradle.gradleUserHomeDir, "caches/fabric-loom/${project.minecraft_version}/minecraft-client.jar")
        // Do not gate this on exists() at configuration time; CI may start with an empty Loom cache.
        compileOnly files(loomClientJar)
    }
}

//If there's mixins
loom {
    accessWidenerPath = file("src/main/resources/${project.mod_id}.accesswidener")
    mixin {
        defaultRefmapName = "${project.mod_id}.refmap.json"
    }
}

sourceSets {
    main {
        java {
            exclude "com/corosus/${project.mod_id}/api/forge/**"
            exclude "com/corosus/${project.mod_id}/loader/forge/**"
            exclude "com/corosus/${project.mod_id}/loader/neoforge/**"
        }
    }
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "mod_id": project.mod_id, "version": project.version, "mod_name": project.mod_name, "mod_description": project.mod_description, "mod_authors": project.mod_authors, "mod_license": project.mod_license
    }

    exclude("META-INF/mods.toml")
    exclude("META-INF/neoforge.mods.toml")
    exclude("META-INF/accesstransformer.cfg")
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    //withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

publisher {
    // Setup the required API keys. You only need to define the keys for
    // the platforms you plan on uploading to
    apiKeys {
        // Modrinth Token
        modrinth System.getenv("MODRINTH_TOKEN")
        // Curseforge Token
        curseforge System.getenv("CURSE_TOKEN")
        // GitHub Token
        //github System.getenv("GITHUB_TOKEN")
    }

    // Enable Debug mode. When enabled, no files will actually be uploaded
    setDebug(false)

    // Curseforge Project ID
    setCurseID("945479")

    // Modrinth Project ID
    setModrinthID("what-are-they-up-to")

    // Type of release. beta, alpha or release
    // You can also use VersionType.BETA, VersionType.ALPHA or VersionType.RELEASE
    setVersionType("release")

    // Changelog. This can be a file, string, OR, gist/github url
    // For example: markdown.md, or "This is my changelog"
    // Or: https://raw.githubusercontent.com/hypherionmc/changelogs/changelog.md
    // Or https://gist.githubusercontent.com/hypherionmc/92f825d3c9337964cc77c9c8c9bf65e6/raw/ceeaaee5b98c688a23398864fe480b84796a1651/test_gist.md
    setChangelog("https://raw.githubusercontent.com/Corosauce/WATUT/refs/heads/1.21.4/changelog.md")

    // Required for Modrinth/GitHub
    setProjectVersion("${project.version}")

    // Fancy display name for the upload.
    // Will default to the project version if not set
    setDisplayName("${project.mod_id}-fabric-${project.mod_version}.jar")

    // The supported game versions
    setGameVersions("${project.minecraft_version}")

    // The modloaders your upload supports.
    // This can also be an Enum from ModLoader,
    // like setLoaders(ModLoader.FABRIC, ModLoader.FORGE)
    //setLoaders("forge", "fabric")
    setLoaders("fabric")

    // The new Curseforge Environment tag. Optional
    // Valid values are "server", "client" or "both"
    // You can also use CurseEnvironment.BOTH, or CurseEnvironment.SERVER or CurseEnvironment.CLIENT
    setCurseEnvironment("both")

    // Upload the release, but keep it "private" until you are ready
    // Unreleased feature on CurseForge, working on Modrinth
    setIsManualRelease(false)

    // The file to be uploaded. This can be a file, task, or string.
    // setArtifact("build/libs/mymod.jar")
    // setArtifact(jar.getArchiveFile().get())
    // If this is a task, the task specified will be executed before publishing
    //setArtifact(jar)
    //setArtifact("build/libs/watut-fabric-1.20.1-1.2.1.jar")
    setArtifact("build/libs/${project.mod_id}-fabric-${project.mod_version}.jar")

    // Override the artifact uploaded to modrinth
    // setPlatformArtifact(Platform.Modrinth, "build/libs/mymod.jar")
    // setPlatformArtifact(Platform.Modrinth, jar.getArchiveFile().get())
    // If this is a task, the task specified will be executed before publishing
    // Valid platforms are modrinth, curseforge and github
    //setPlatformArtifact("modrinth", modrinthJar)

    // Disable the built in Fractureizer scanner
    setDisableMalwareScanner(true)

    // Add supported java versions. Currently only used by CurseForge
    // Supports anything that can be parsed using JavaVersion.toVersion()
    setJavaVersions(JavaVersion.VERSION_25, 25)

    // Safety check to check if the artifact contains a valid mod metadata entry,
    // which could possibly mean that the jar is empty
    setDisableEmptyJarCheck(true)

    // Additional files to upload. Same as artifact, this can be a task, file or string
    //addAdditionalFile(jar, secondJar)

    // Additional files to upload with a custom display name and changelog.
    // Currently only supported on Curseforge
    /*addAdditionalFile {
        // File, Task or String
        artifact jar
        displayName "Some Name"
        changelog "Hello Changelog"
    }*/

    modrinthDepends {
        required "coroutil"

        /*// Single dependency
        required "fabric-api"

        // Optional dependency
        optional 'optional-dep'

        // Your mod is not compatible with this mod
        incompatible 'breaks-with'

        // Your mod embeds this dependency
        embedded 'fabric-api'*/
    }

// Curse Dependencies
    curseDepends {
        required "coroutil"
    }
}
